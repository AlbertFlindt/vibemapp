name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: check.sh (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install system packages
        run: |
          pacman -Syu --noconfirm --needed git python python-gobject python-cairo gtk4 libadwaita glib2 \
            gtk4-layer-shell desktop-file-utils appstream meson xorg-server-xvfb \
            xorg-xauth adwaita-icon-theme
      - uses: actions/checkout@v4
      - name: Run check.sh
        # GTK needs a display for the UI tests; Xvfb is enough (overlay tests fake layer-shell).
        run: xvfb-run -a ./check.sh

  release-ready:
    # Every merge that changes the app publishes a pre-release of the version on main, so such a
    # PR needs a version above the latest stable one and a CHANGELOG entry for it.
    name: Version and changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a new version and a CHANGELOG entry when the app changes
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          echo "Changed files:"; echo "$changed" | sed 's/^/  /'
          # Docs, CI and Claude Code files alone don't need a release.
          app=$(echo "$changed" | grep -Ev '^(\.github/|\.claude/|docs/|[^/]+\.md$|CLAUDE|check\.sh$|build-aux/(version|docs_check)\.py$)' || true)
          if [ -z "$app" ]; then
            echo "Only docs/CI changed: no release needed."; exit 0
          fi
          python3 build-aux/version.py check
          new=$(python3 build-aux/version.py get)
          stable=$(git tag -l 'v*' | grep -v -- '-pre' | sed 's/^v//' | sort -V | tail -1)
          if [ "$new" = "$stable" ] || [ "$(printf '%s\n%s\n' "$stable" "$new" | sort -V | tail -1)" != "$new" ]; then
            echo "::error::Version $new is not above the latest stable $stable. Run build-aux/version.py bump X.Y.Z (see the release skill)."
            exit 1
          fi
          if ! echo "$changed" | grep -qx CHANGELOG.md; then
            echo "::error::This PR changes the app but not CHANGELOG.md. Add an entry under '## $new'."
            exit 1
          fi
          if [ "$(python3 build-aux/version.py state)" = stable ]; then
            echo "Will release $new as stable on merge (was $stable)."
          else
            echo "Will publish a $new pre-release on merge (latest stable: $stable)."
          fi
